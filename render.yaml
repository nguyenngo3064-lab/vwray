services:
  - type: web
    name: vwray-control-plane
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vwray-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_BOOTSTRAP_CODE_RETRIEVAL
        value: "false"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"

databases:
  - name: vwray-postgres
    databaseName: vwray
    user: vwray
    plan: free
